name: Observability

on:
  push:
  pull_request:

jobs:
  verify:
    name: Verify dashboards and alerts
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '~1.26.0'

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.54.0

      - name: Verify
        run: task --yes observability:verify
