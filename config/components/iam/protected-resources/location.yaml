apiVersion: iam.miloapis.com/v1alpha1
kind: ProtectedResource
metadata:
  name: locations.miloapis.com-location
spec:
  serviceRef:
    name: "locations.miloapis.com"
  kind: Location
  plural: locations
  singular: location
  permissions:
