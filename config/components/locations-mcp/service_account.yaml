# Deliberately unbound — do not add a Role, ClusterRole, or binding for this
# account. locations-mcp reads as the caller, using the bearer token off each
# request, so the asker's own access is the single enforcement point; granting
# this account read access to Locations would restore exactly the ambient
# authority that removes, for every project, one prompt injection away.
#
# The token is still mounted, and nothing reads it. The API address and CA come
# from the kubeconfig the deployment supplies, and clientForToken strips every
# credential off that config before setting the caller's, so this account's
# token can never reach an API server. Leave it mounted or drop it as you like;
# what must not change is that no Role or binding is ever attached.
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/instance: locations-mcp
    app.kubernetes.io/name: locations-mcp
  name: locations-mcp
