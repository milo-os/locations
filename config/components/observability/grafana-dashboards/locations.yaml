apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: locations
  labels:
    app.kubernetes.io/name: locations
spec:
  instanceSelector:
    matchLabels:
      dashboards: vm-grafana
  allowCrossNamespaceImport: true
  folder: Platform / Locations
  resyncPeriod: 5m
  configMapRef:
    name: locations-dashboard
    key: dashboard.json
