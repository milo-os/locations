apiVersion: apiserver.config.miloapis.com/v1alpha1
kind: LocationOperator
metricsServer:
  bindAddress: "0"
# kubeconfigPath points at the Milo control plane API server.
# Leave empty to use in-cluster config (default when deployed alongside the API server).
# kubeconfigPath: /etc/milo/kubeconfig

# The publisher copies each Location onto the federation hub as a
# ServingLocation, so every cell is told which location it serves. It stays off
# until hubKubeconfigPath is set, and must be set on exactly one deployment.
#
# locationPublisher:
#   hubKubeconfigPath: /etc/federation/kubeconfig
#   safetyResyncPeriod: 30m
#   locationScopedResources:
#     - apiVersion: networking.datumapis.com/v1alpha
#       kind: NetworkContext
#       locationLabel: networking.datumapis.com/location
#     - apiVersion: networking.datumapis.com/v1alpha
#       kind: Subnet
#       locationLabel: networking.datumapis.com/location

# Readiness reporting writes status.conditions[Ready] on the Locations backed by
# a class naming this controller, and status.conditions[Accepted] on those
# classes. It stays off until controllerName is set.
#
# locationReadiness:
#   controllerName: locations.miloapis.com/shared-edge
